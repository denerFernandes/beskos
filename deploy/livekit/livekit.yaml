# LiveKit server — dev local. Em produção: TLS/proxy, TURN e IPs/portas reais.
# node_ip 127.0.0.1 faz o servidor anunciar candidatos ICE alcançáveis pelo browser na mesma
# máquina (Docker Desktop encaminha as portas publicadas). Uma única porta UDP simplifica o publish.
port: 7880
# Redis: coordena o Egress (gravação). Sem ele, gravação fica indisponível.
redis:
  address: redis:6379
# Sala encerra ~2min após ficar vazia → a reunião vira "ended" e a duração é calculada.
room:
  empty_timeout: 120
  departure_timeout: 20
rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: devsecret_livekit_change_me_0123456789
# Webhooks server-to-server → nossa API (tempos reais/presença). api_key deve existir em keys.
webhook:
  api_key: devkey
  urls:
    - http://api:8000/meet/webhook
logging:
  level: info
