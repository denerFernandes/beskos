# Foundation
# Brings up the mail engine (official Stalwart, NOT modified), Postgres and MinIO.
# Stalwart runs the pinned official image; we only mount config and talk to it over the network.
name: mailin

services:
  stalwart:
    # PINNED version (brief §2/§9). Do not use :latest -- Stalwart is pre-1.0 and changes payloads
    # between versions.
    image: stalwartlabs/stalwart:v0.16.4
    container_name: mailin-stalwart
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Management/JMAP on the host only (the webmail reaches it through the Vite/Caddy same-origin
      # proxy). Do not expose the Management API to the LAN/internet -- Stalwart admin credentials
      # pass through here.
      - "127.0.0.1:8080:8080"   # HTTP: Management API + JMAP + webadmin
      - "25:25"                 # SMTP (public: receives mail)
      - "587:587"               # Submission (public)
      - "465:465"               # SMTPS (public)
      - "143:143"               # IMAP (public)
      - "993:993"               # IMAPS (public)
    volumes:
      - stalwart_data:/opt/stalwart
      # /etc/stalwart/config.json is WHERE THE IMAGE LOOKS (`--config`). The old path
      # (/opt/stalwart/etc/config.toml) was never read -- see DIVERGENCES §D9.
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
    environment:
      # GLOBAL recovery admin. Actual format in v0.16.4: user:password (found by testing).
      # Only the Go backend uses it; it NEVER reaches the frontend (brief §2).
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_SECRET}"
      # Read by config.json (authSecret -> EnvironmentVariable).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # SES relay: configured in Stalwart's REGISTRY (admin interface), not in a file -- see
      # deploy/stalwart/README.md for the instructions. Empty in dev -- harmless while the block
      # stays commented out.
      SES_SMTP_USER: "${SES_SMTP_USER:-}"
      SES_SMTP_PASS: "${SES_SMTP_PASS:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + the pgvector extension (wiki RAG). Same major as the
    # current data dir (16.x), so the volume stays compatible. `CREATE EXTENSION vector` is in the
    # migration.
    image: pgvector/pgvector:pg16
    container_name: mailin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NO port published on the host: Postgres is reachable only through the internal Docker network
    # (the API connects to postgres:5432). Do not expose the datastore to the host/network. To debug
    # with a local client, use `docker exec mailin-postgres psql ...` or a one-off tunnel.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Stalwart's config.json points at a SECOND database that nothing else creates. Without this
      # mount a fresh volume leaves Stalwart crash-looping on `database "stalwart" does not exist`
      # -- docker-compose.community.yml has always had it; this file did not.
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned by digest (RELEASE.2025-09-07T16-13-09Z) -- reproducible and immutable.
    # quay.io, not Docker Hub: minio/minio stopped being pullable from docker.io
    # ("pull access denied ... repository does not exist"). Same image, same digest.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: mailin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # NO port published on the host: the API reaches MinIO at minio:9000 over the internal network.
    # To open the console (9001) occasionally in dev, publish it in a local override, not in the
    # base compose file.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Control plane (our Go code): panel/webmail API + workers.
  api:
    build: ../backend
    container_name: mailin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"   # behind the proxy (Vite/Caddy) -- do not expose directly
    environment: &control_env
      HTTP_ADDR: ":8000"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      STALWART_URL: "http://stalwart:8080"
      STALWART_ADMIN_ID: "admin"
      STALWART_ADMIN_SECRET: "${STALWART_ADMIN_SECRET}"
      STALWART_HOSTNAME: "${STALWART_HOSTNAME:-mail.localhost}"
      STALWART_DEFAULT_DOMAIN: "${STALWART_DEFAULT_DOMAIN:-localhost}"
      # Object storage. Defaults to the MinIO container beside it; set these to point at an
      # S3-compatible service instead, which is what an installation that already has one does.
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}"
      MINIO_BUCKET: "${MINIO_BUCKET:-mailin}"
      MINIO_REGION: "${MINIO_REGION:-}"
      MINIO_SSL: "${MINIO_SSL:-false}"
      # Envelope encryption for stored files. The code reads this and, without it, writes and
      # serves in the clear -- and cannot read anything an encrypted instance wrote. It was absent
      # from this file, so setting it in the environment had no effect at all.
      FILE_ENC_KEYS: "${FILE_ENC_KEYS:-}"
      MAIL_BRAND_DOMAIN: "${MAIL_BRAND_DOMAIN:-}"
      SES_ACCOUNT_ID: "${SES_ACCOUNT_ID:-}"
      SES_DKIM_SELECTOR: "${SES_DKIM_SELECTOR:-}"
      EMBEDDINGS_DIMENSIONS: "${EMBEDDINGS_DIMENSIONS:-}"
      # Any endpoint speaking the OpenAI-compatible chat API. AI_PROVIDER is a label, and a
      # preset when it is a known name; AI_BASE_URL is what points this anywhere else and was
      # absent here, so setting it had no effect at all.
      AI_PROVIDER: "${AI_PROVIDER:-deepseek}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_REASONING: "${AI_REASONING:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      # Email notifications: submitted through Stalwart itself, port 465 (implicit TLS).
      # Stalwart's 587 does NOT work -- the listener closes the connection (measured on 15/07/2026).
      # INSECURE only in dev (self-signed cert); in production, a valid cert and insecure=false.
      NOTIFY_SMTP_HOST: "${NOTIFY_SMTP_HOST:-}"
      NOTIFY_SMTP_PORT: "${NOTIFY_SMTP_PORT:-465}"
      NOTIFY_SMTP_USER: "${NOTIFY_SMTP_USER:-}"
      NOTIFY_SMTP_PASSWORD: "${NOTIFY_SMTP_PASSWORD:-}"
      NOTIFY_FROM: "${NOTIFY_FROM:-}"
      NOTIFY_SMTP_INSECURE: "${NOTIFY_SMTP_INSECURE:-false}"
      AI_MODEL: "${AI_MODEL:-}"
      # Wiki RAG embeddings (OpenAI-compatible; docs/wiki-features.md §7.2). Without the key, the
      # embedding worker and semantic search stay off (fail-safe).
      EMBEDDINGS_API_KEY: "${EMBEDDINGS_API_KEY:-}"
      EMBEDDINGS_BASE_URL: "${EMBEDDINGS_BASE_URL:-}"
      EMBEDDINGS_MODEL: "${EMBEDDINGS_MODEL:-text-embedding-3-small}"
      # SES relay (production): with all three set, the worker registers each new domain as an
      # SES identity (Easy DKIM) and injects CNAMEs/SPF/DMARC into the zone the customer publishes.
      SES_REGION: "${SES_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # MFA SMS: "log" (dev) or "sns" (Amazon SNS; uses the AWS credentials above; an optional
      # region of its own in SNS_REGION -- otherwise it falls back to SES_REGION; SMS_SENDER_ID
      # optional).
      SMS_PROVIDER: "${SMS_PROVIDER:-log}"
      SNS_REGION: "${SNS_REGION:-}"
      SMS_SENDER_ID: "${SMS_SENDER_ID:-}"
      BILLING_PROVIDER: "${BILLING_PROVIDER:-manual}"
      BILLING_CURRENCY: "${BILLING_CURRENCY:-BRL}"
      BILLING_MIN_PAID_USERS: "${BILLING_MIN_PAID_USERS:-1}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      BILLING_SUCCESS_URL: "${BILLING_SUCCESS_URL:-${PUBLIC_URL:-http://localhost:5173}/mail/admin/billing?ok=1}"
      BILLING_CANCEL_URL: "${BILLING_CANCEL_URL:-${PUBLIC_URL:-http://localhost:5173}/mail/admin/billing?canceled=1}"
      PROVISION_SKIP_DNS_VERIFY: "${PROVISION_SKIP_DNS_VERIFY:-false}"
      # Office editing (OnlyOffice Document Server). ONLYOFFICE_URL: the URL the BROWSER uses
      # (api.js + editor). FILES_HOST_URL: how the Document Server reaches OUR API
      # (download/callback, server-to-server). ONLYOFFICE_JWT_SECRET: shared with the DS.
      ONLYOFFICE_URL: "${ONLYOFFICE_URL:-http://localhost:8082}"
      ONLYOFFICE_INTERNAL_URL: "http://onlyoffice"
      FILES_HOST_URL: "http://api:8000"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-dev-oo-jwt-secret-change-me}"
      # Source of the modified Document Server (branding patch), shown in the editor's "About".
      # Required in APP_ENV=production -- it is the source offer that AGPL v3 §13 demands.
      ONLYOFFICE_SOURCE_URL: "${ONLYOFFICE_SOURCE_URL:-}"
      DOC_TOKEN_SECRET: "${DOC_TOKEN_SECRET:-dev-doc-token-secret-change-me}"
      # Meet (LiveKit). LIVEKIT_URL: the WebSocket the BROWSER uses. API_KEY/SECRET sign the room
      # tokens (they must match deploy/livekit/livekit.yaml).
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://localhost:7880}"
      LIVEKIT_HTTP_URL: "http://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret_livekit_change_me_0123456789}"
      # Web Push (desktop notifications with the app closed). Off without VAPID_PRIVATE_KEY.
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@localhost}"
      # Per-file ceiling in Files (bytes). Default 100 GiB. The plan quota applies on top.
      FILES_MAX_UPLOAD_BYTES: "${FILES_MAX_UPLOAD_BYTES:-107374182400}"
      # Native app (Tauri desktop/mobile): origins allowed for CORS with credentials
      # (comma-separated, e.g. "tauri://localhost,https://tauri.localhost"). Without this, CORS
      # stays off (same-origin web does not need it). COOKIE_SECURE=true in HTTPS production so
      # the session cookie goes out as SameSite=None; Secure (required cross-site).
      APP_ORIGINS: "${APP_ORIGINS:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Public URL of the app, for absolute links sent in emails (e.g. a meeting room).
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Environment: "production" makes config fail closed (rejects empty/weak/default secrets).
      APP_ENV: "${APP_ENV:-development}"
      # Encrypts the JMAP credential and the TOTP secret at rest (required in production). See
      # .env.example.
      MFA_ENC_KEY: "${MFA_ENC_KEY:-}"
    healthcheck:
      # readyz (not healthz): reports healthy only when Postgres also answers, so compose does not
      # route traffic before the database is ready.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # OnlyOffice Document Server -- office editor (docx/xlsx/pptx). Runs the official image,
  # MODIFIED at startup by two of our scripts (AI config + branding) -- unlike Stalwart, which
  # stays untouched (law §5.4). The modification is allowed by AGPL v3 and is recorded in
  # DIVERGENCES.md; the attribution to Ascensio System SIA stays in "About".
  # JWT_SECRET must match the api's ONLYOFFICE_JWT_SECRET. In production: serve behind
  # HTTPS/a same-origin proxy. From Docs 9.4 onwards there is no longer a 20-connection ceiling.
  onlyoffice:
    # Pinned by digest (OnlyOffice Docs 9.4.0-129, Ubuntu 24.04 base) -- reproducible and immutable.
    # The branding patch depends on the NON-minified web-apps, which only exists from 9.4 onwards.
    image: onlyoffice/documentserver@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b
    container_name: mailin-onlyoffice
    restart: unless-stopped
    # Startup wrapper: injects the AI config (Beskos AI) into default.json, applies the branding
    # patch to web-apps and only then starts the DS. Both fail closed: the DS starts regardless.
    entrypoint: ["/bin/sh", "/scripts/onlyoffice-ai-init.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-dev-oo-jwt-secret-change-me}"
      JWT_HEADER: "Authorization"
      # ORIGIN of our AI proxy -- the DS ai-proxy uses only the origin and appends the provider's
      # path (/v1/chat/completions). From inside the container, it is the service name on the
      # docker network.
      AI_PROXY_URL: "${AI_PROXY_URL:-http://api:8000}"
    volumes:
      # In dev we mount the scripts into the official image; in production they are COPIED into
      # the image (deploy/onlyoffice/Dockerfile), because CapRover deploys by image and mounts
      # nothing from the repository. Same script in both places.
      # NOTE: a single-FILE mount is bound to the inode -- after editing one of these scripts,
      # run `docker compose up -d --force-recreate onlyoffice`, not `restart`.
      - ./onlyoffice/onlyoffice-ai-init.sh:/scripts/onlyoffice-ai-init.sh:ro
      - ./onlyoffice/onlyoffice-branding-patch.sh:/scripts/onlyoffice-branding-patch.sh:ro
      - ./onlyoffice/brand:/scripts/brand:ro
    ports:
      - "127.0.0.1:8082:80"   # host only (browser in dev via localhost; prod behind an HTTPS proxy)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 15

  # LiveKit -- Meet's video call server (WebRTC SFU). Official image, network-only, unmodified
  # (same stance as Stalwart/OnlyOffice). Config in ./livekit/livekit.yaml.
  # Ports: 7880 (signaling WS), 7881 (TCP fallback), 7882/udp (media). Production: TLS + TURN.
  livekit:
    # Pinned by digest (v1.13.3) -- reproducible and immutable.
    image: livekit/livekit-server@sha256:483b8b7b5b0654f91f1e8bdc7b46fcd37fd9911612ecf627f97e3185a89825bd
    container_name: mailin-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Redis -- coordinates LiveKit <-> Egress (recording).
  redis:
    # Pinned by digest (redis:7-alpine) -- reproducible and immutable.
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: mailin-redis
    restart: unless-stopped

  # LiveKit Egress -- records the meeting (headless Chrome composes the room) and uploads the MP4
  # to MinIO. Official image, unmodified. Needs SYS_ADMIN + a large /dev/shm for Chrome.
  egress:
    # Pinned by digest (v1.13.0) -- reproducible and immutable.
    image: livekit/egress@sha256:980ff439431df2c773573721ab6da19e15bdc1f049ab7cb80e87470bf174c12f
    container_name: mailin-egress
    restart: unless-stopped
    # Shares LiveKit's network stack: that way 127.0.0.1 (node_ip) points at LiveKit's RTC and the
    # egress Chrome receives the media. Redis/MinIO resolve over the same network.
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    depends_on:
      - redis
      - livekit

  worker:
    build: ../backend
    container_name: mailin-worker
    restart: unless-stopped
    command: ["/usr/local/bin/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for api, not just postgres: api is what applies the migrations, and it only answers
      # /readyz once they are done. Starting alongside it means every scan loop here queries tables
      # that do not exist yet, and a first `docker compose up` opens with a screen of
      # "relation ... does not exist" errors that fix themselves a tick later.
      api:
        condition: service_healthy
    environment: *control_env

  # Manager -- API for the SaaS OPERATOR's panel (docs/manager.md). Isolated on purpose: its own
  # minimal env (does NOT inherit control_env), its own sessions/port, mandatory TOTP.
  manager-api:
    build: ../backend
    container_name: mailin-manager-api
    restart: unless-stopped
    command: ["/usr/local/bin/manager-api"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"   # behind Next dev/Caddy -- do not expose directly
    environment:
      MANAGER_HTTP_ADDR: ":8091"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      MFA_ENC_KEY: "${MFA_ENC_KEY:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # First operator (only with an empty table; can be removed from .env afterwards).
      MANAGER_BOOTSTRAP_EMAIL: "${MANAGER_BOOTSTRAP_EMAIL:-}"
      MANAGER_BOOTSTRAP_PASSWORD: "${MANAGER_BOOTSTRAP_PASSWORD:-}"
      # Catalog mirror in Stripe (saving a plan -> Product/Price there).
      BILLING_PROVIDER: "${BILLING_PROVIDER:-manual}"
      BILLING_CURRENCY: "${BILLING_CURRENCY:-BRL}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"

volumes:
  stalwart_data:
  postgres_data:
  minio_data:
