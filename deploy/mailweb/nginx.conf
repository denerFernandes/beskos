# mail.beskos.com — o hospedeiro do servidor de correio, em HTTPS.
#
# Porque existe: o porto 443 desta máquina é do nginx do CapRover, que não conhecia
# `mail.beskos.com` e servia o certificado auto-assinado por omissão. Quem apontasse um Thunderbird
# ou um cliente JMAP a este nome batia num aviso de certificado. Agora há uma app (`mail`) que
# reclama o nome e recebe certificado Let's Encrypt como as outras.
#
# O que NÃO faz: expor o HTTP do Stalwart. Esse porto (8080) está preso ao localhost de propósito —
# leva a API de administração, com credenciais que dão acesso a todas as caixas. Aqui só passam os
# caminhos de descoberta, e passam pelo mesmo sítio por onde o webmail já os serve.

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=30s ipv6=off;
  # O container do webmail, que já sabe encaminhar estes caminhos para a API Go e daí para o
  # Stalwart. Um salto a mais, zero superfície nova.
  set $web "srv-captain--app";

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Descoberta automática: é para isto que um cliente de correio procura o nome do servidor.
  #   /.well-known/jmap            sessão JMAP (RFC 8620)
  #   /.well-known/caldav|carddav  calendário e contactos
  #   /.well-known/acme-challenge  validação do certificado
  location /.well-known/ { proxy_pass http://$web; }
  location /jmap         { proxy_pass http://$web; }

  # Tudo o resto vai para a aplicação. Quem escreve "mail.beskos.com" no browser quer o correio,
  # não uma página de erro.
  location / { return 301 https://app.beskos.com/mail; }
}
