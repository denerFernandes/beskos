# Servido pelo container do webmail. Estático + proxy same-origin para a API Go.
# ${API_UPSTREAM} é substituído no arranque (envsubst da imagem nginx); as $vars do nginx ficam.

# Header Connection do WebSocket (upgrade quando há Upgrade, senão close).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker/Swarm — resolve o serviço da API em runtime (não falha se ele subir depois).
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api "${API_UPSTREAM}";

  client_max_body_size 2g;   # anexos grandes vão via API antes de irem para o R2

  # Cabeçalhos de WebSocket/SSE (JMAP push + chat).
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;   # SSE de longa duração

  location /api/          { proxy_pass http://$api; }
  location /jmap          { proxy_pass http://$api; }
  location /auth/         { proxy_pass http://$api; }
  location /.well-known/  { proxy_pass http://$api; }
  # Rotas de raiz (fora de /api) servidas pela API Go: webhook do LiveKit (server-to-server),
  # callbacks/AI do OnlyOffice. O SPA não usa estes caminhos, por isso é seguro encaminhá-los.
  location /meet/         { proxy_pass http://$api; }
  location /doc/          { proxy_pass http://$api; }
  location = /v1/chat/completions { proxy_pass http://$api; }
  location = /v1/models           { proxy_pass http://$api; }

  # Assets com hash → cache longo. O resto cai no SPA (routing do lado do cliente).
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
