name: Public export boundary

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  public-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - name: Install database generator
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
      - name: Export regression tests
        run: python3 -m unittest discover -s scripts -p 'test_export_public.py'
      - name: Export without the operator console
        run: python3 scripts/export_public.py "$RUNNER_TEMP/beskos-public" --private-only
      - name: Verify generated database code is reproducible
        working-directory: ${{ runner.temp }}/beskos-public
        run: |
          git init
          git add backend/internal/db
          (cd backend && sqlc generate)
          git diff --exit-code -- backend/internal/db
      - name: Verify exported Community and Pro backends
        working-directory: ${{ runner.temp }}/beskos-public/backend
        run: |
          go vet ./...
          go build ./...
          go test ./...
          go vet -tags pro ./...
          go build -tags pro ./...
          go test -tags pro ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exported frontend
        working-directory: ${{ runner.temp }}/beskos-public/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm test
