name: CI

# Condição de merge (leis §2.1): gofmt + go vet limpos, build e testes a passar no backend;
# TypeScript strict a compilar e testes a passar no frontend. O bundle Tauri (desktop) é
# verificado com cargo check num job à parte para não bloquear o essencial.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: backend/go.sum
      - name: gofmt (sem ficheiros por formatar)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Ficheiros por formatar (corra gofmt -w):"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: sqlc — código gerado está atualizado
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          "$(go env GOPATH)/bin/sqlc" generate
          if ! git diff --exit-code -- internal/db; then
            echo "internal/db desatualizado: corra 'sqlc generate' e faça commit."; exit 1
          fi

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (tsc strict + vite)
        run: npm run build
      - name: Testes (vitest)
        run: npm test

  sync-daemon:
    name: Sync daemon (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked

  desktop:
    name: Desktop (Tauri / cargo check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Dependências de sistema do Tauri 2 no Linux (webkit2gtk 4.1 + libs de janela).
      - name: Dependências do sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev build-essential curl wget file
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo check
        run: cargo check --locked
