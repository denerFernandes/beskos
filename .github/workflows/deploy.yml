name: build & deploy

# Constrói APENAS o que mudou e publica no CapRover (rolling update).
#
# Antes corria a cada push e reconstruía as seis imagens: mudar uma palavra num texto reiniciava o
# correio, a API e o editor de documentos. Gastava minutos à toa — foi o que esgotou o limite da
# conta — e cada reinício desnecessário é uma janela de risco que ninguém pediu. Um passo `plano`
# olha agora para os ficheiros alterados e monta a matriz; se nada mexeu num contexto, não há build.
#
# Segredos necessários (repo → Settings → Secrets):
#   CAPROVER_URL       ex.: https://captain.beskos.com
#   CAPROVER_PASSWORD  password do painel CapRover
# O push para o ghcr usa o GITHUB_TOKEN (packages: write). O CapRover puxa do ghcr — configurar
# uma vez o registry privado ghcr no painel (Cluster → Docker Registries).
#
# Via alternativa, sem GitHub: `python3 deploy/deploy.py <app>` constrói no próprio CapRover.

# NÃO corre sozinho. A via normal de publicação passou a ser `python3 deploy/deploy.py <app>`,
# que constrói no CapRover e não consome minutos do GitHub — foram eles que esgotaram o limite da
# conta. Este workflow fica para quando se quiser usar o Actions de propósito: Actions → build &
# deploy → Run workflow. A seleção do que construir continua a valer (só o que mudou).
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: denerfernandes          # namespace ghcr (minúsculas)

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.decidir.outputs.builds }}
      deploys: ${{ steps.decidir.outputs.deploys }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 0 }

      - name: o que mudou
        id: decidir
        env:
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          # Push forçado, primeiro commit ou arranque manual: constrói tudo. Mais vale gastar uma
          # vez do que deixar produção com uma imagem que não corresponde ao código.
          if [ "$MANUAL" = "true" ] || [ -z "$ANTES" ] \
             || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            MUDOU="TUDO"
          else
            MUDOU="$(git diff --name-only "$ANTES" "$AGORA")"
          fi
          echo "ficheiros alterados:"; echo "$MUDOU" | head -40

          tocou() {
            [ "$MUDOU" = "TUDO" ] && return 0
            # Mexer no próprio workflow reconstrói tudo: a receita mudou.
            echo "$MUDOU" | grep -qE '^\.github/workflows/' && return 0
            echo "$MUDOU" | grep -qE "^$1" && return 0
            return 1
          }

          builds='[]'; deploys='[]'
          juntar() {
            python3 -c "import json,sys; a=json.loads(sys.argv[1]); a.append(json.loads(sys.argv[2])); print(json.dumps(a))" "$1" "$2"
          }

          if tocou 'backend/'; then
            builds=$(juntar "$builds" '{"name":"beskos-api","context":"backend"}')
            for app in api worker manager-api; do
              deploys=$(juntar "$deploys" "{\"app\":\"$app\",\"image\":\"beskos-api\"}")
            done
          fi
          if tocou 'frontend/'; then
            builds=$(juntar "$builds" '{"name":"beskos-frontend","context":"frontend"}')
            deploys=$(juntar "$deploys" '{"app":"app","image":"beskos-frontend"}')
          fi
          if tocou 'manager/'; then
            builds=$(juntar "$builds" '{"name":"beskos-manager","context":"manager"}')
            deploys=$(juntar "$deploys" '{"app":"manager","image":"beskos-manager"}')
          fi
          # Document Server com a nossa marca: imagem oficial pinada + patch aplicado no build.
          if tocou 'deploy/onlyoffice/'; then
            builds=$(juntar "$builds" '{"name":"beskos-docs","context":"deploy/onlyoffice"}')
            deploys=$(juntar "$deploys" '{"app":"docs","image":"beskos-docs"}')
          fi
          if tocou 'deploy/mailweb/'; then
            builds=$(juntar "$builds" '{"name":"beskos-mailweb","context":"deploy/mailweb"}')
            deploys=$(juntar "$deploys" '{"app":"mail","image":"beskos-mailweb"}')
          fi
          if tocou 'deploy/backup/'; then
            builds=$(juntar "$builds" '{"name":"beskos-backup","context":"deploy/backup"}')
            deploys=$(juntar "$deploys" '{"app":"backup","image":"beskos-backup"}')
          fi

          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "deploys=$deploys" >> "$GITHUB_OUTPUT"
          echo "→ constrói: $builds"
          echo "→ publica:  $deploys"

  build:
    needs: plano
    if: needs.plano.outputs.builds != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Sem fail-fast: uma imagem que falha não cancela as outras. Foi assim que um único job
      # recusado por faturação levou os outros cinco atrás.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plano.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [plano, build]
    if: needs.plano.outputs.deploys != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1            # um de cada vez (rolling, sem sobrecarregar o cluster)
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plano.outputs.deploys) }}
    steps:
      - name: deploy ${{ matrix.app }}
        run: |
          npx -y caprover@2 deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "${{ matrix.app }}" \
            --imageName "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}"
