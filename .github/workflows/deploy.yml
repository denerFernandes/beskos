name: build & deploy

# Builds ONLY what changed and publishes it to CapRover (rolling update).
#
# It used to run on every push and rebuild all six images: changing one word in a text restarted
# mail, the API and the document editor. It burned minutes for nothing — that is what exhausted the
# account's limit — and every unnecessary restart is a window of risk nobody asked for. A `plano`
# step now looks at the changed files and builds the matrix; if nothing touched a context, no build.
#
# Required secrets (repo → Settings → Secrets):
#   CAPROVER_URL       e.g.: https://captain.beskos.com
#   CAPROVER_PASSWORD  CapRover dashboard password
# The push to ghcr uses GITHUB_TOKEN (packages: write). CapRover pulls from ghcr — configure the
# private ghcr registry once in the dashboard (Cluster → Docker Registries).
#
# Alternative route, without GitHub: `python3 deploy/deploy.py <app>` builds on CapRover itself.

# Does NOT run on its own. The normal publishing route is now `python3 deploy/deploy.py <app>`,
# which builds on CapRover and does not consume GitHub minutes — those are what exhausted the
# account's limit. This workflow remains for when Actions is used on purpose: Actions → build &
# deploy → Run workflow. The selection of what to build still applies (only what changed).
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: denerfernandes          # ghcr namespace (lowercase)

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.decidir.outputs.builds }}
      deploys: ${{ steps.decidir.outputs.deploys }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 0 }

      - name: o que mudou
        id: decidir
        env:
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          # Forced push, first commit or manual start: build everything. Better to spend once than
          # to leave production with an image that does not match the code.
          if [ "$MANUAL" = "true" ] || [ -z "$ANTES" ] \
             || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            MUDOU="TUDO"
          else
            MUDOU="$(git diff --name-only "$ANTES" "$AGORA")"
          fi
          echo "ficheiros alterados:"; echo "$MUDOU" | head -40

          tocou() {
            [ "$MUDOU" = "TUDO" ] && return 0
            # Touching the workflow itself rebuilds everything: the recipe changed.
            echo "$MUDOU" | grep -qE '^\.github/workflows/' && return 0
            echo "$MUDOU" | grep -qE "^$1" && return 0
            return 1
          }

          builds='[]'; deploys='[]'
          juntar() {
            python3 -c "import json,sys; a=json.loads(sys.argv[1]); a.append(json.loads(sys.argv[2])); print(json.dumps(a))" "$1" "$2"
          }

          if tocou 'backend/'; then
            builds=$(juntar "$builds" '{"name":"beskos-api","context":"backend"}')
            for app in api worker manager-api; do
              deploys=$(juntar "$deploys" "{\"app\":\"$app\",\"image\":\"beskos-api\"}")
            done
          fi
          if tocou 'frontend/'; then
            builds=$(juntar "$builds" '{"name":"beskos-frontend","context":"frontend"}')
            deploys=$(juntar "$deploys" '{"app":"app","image":"beskos-frontend"}')
          fi
          if tocou 'manager/'; then
            builds=$(juntar "$builds" '{"name":"beskos-manager","context":"manager"}')
            deploys=$(juntar "$deploys" '{"app":"manager","image":"beskos-manager"}')
          fi
          # Document Server with our branding: pinned official image + patch applied at build time.
          if tocou 'deploy/onlyoffice/'; then
            builds=$(juntar "$builds" '{"name":"beskos-docs","context":"deploy/onlyoffice"}')
            deploys=$(juntar "$deploys" '{"app":"docs","image":"beskos-docs"}')
          fi
          if tocou 'deploy/mailweb/'; then
            builds=$(juntar "$builds" '{"name":"beskos-mailweb","context":"deploy/mailweb"}')
            deploys=$(juntar "$deploys" '{"app":"mail","image":"beskos-mailweb"}')
          fi
          if tocou 'deploy/backup/'; then
            builds=$(juntar "$builds" '{"name":"beskos-backup","context":"deploy/backup"}')
            deploys=$(juntar "$deploys" '{"app":"backup","image":"beskos-backup"}')
          fi

          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "deploys=$deploys" >> "$GITHUB_OUTPUT"
          echo "→ constrói: $builds"
          echo "→ publica:  $deploys"

  build:
    needs: plano
    if: needs.plano.outputs.builds != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # No fail-fast: one failing image does not cancel the others. That is how a single job
      # refused over billing took the other five down with it.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plano.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [plano, build]
    if: needs.plano.outputs.deploys != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1            # one at a time (rolling, without overloading the cluster)
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plano.outputs.deploys) }}
    steps:
      - name: deploy ${{ matrix.app }}
        run: |
          npx -y caprover@2 deploy \
            --caproverUrl "${{ secrets.CAPROVER_URL }}" \
            --caproverPassword "${{ secrets.CAPROVER_PASSWORD }}" \
            --appName "${{ matrix.app }}" \
            --imageName "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}"
